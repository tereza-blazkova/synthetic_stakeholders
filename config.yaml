# Study configuration. Small tier pinned 2026-10-16; large tier (UCloud) added
# 2026-10-20, digests pinned after the first pull on UCloud. No secrets here.

study:
  n_runs_per_model: 10
  pilot_runs_per_model: 1
  # Run k uses seed seeds[k] for every model, so speaking orders are matched
  # across model conditions. The seed shuffles turn order within each room.
  # Runs 11-20 (seeds 111-120) are the optional second batch (Tereza, 2026-10-20).
  seeds: [101, 102, 103, 104, 105, 106, 107, 108, 109, 110,
          111, 112, 113, 114, 115, 116, 117, 118, 119, 120]
  pilot_seed: 100
  test_year: 2021

inputs:
  personas: inputs/personas.yaml
  survey: inputs/materials/survey.yaml
  facilitator_script: inputs/materials/facilitator_script.yaml
  framing_intro: inputs/materials/framing_intro.md
  specification_template: inputs/materials/specification_template.md
  metrics: inputs/metrics_2021.csv
  ground_truth: inputs/human_ground_truth.yaml

# Sampling: identical for all three conditions.
sampling:
  temperature: 1.0          # gives run-to-run variation; same everywhere
  reasoning: lowest         # lowest reasoning setting, or off where the model allows
  max_output_tokens: 4000   # per call; surveys are the longest outputs

budget:
  hard_cap_usd: null        # only if a hosted API is used

local:
  num_ctx: 16384             # small tier, lite protocol: longest prompt ~10-12k tokens
gpu:
  num_ctx: 65536             # large tier (lite and full); raised from 40960 after a full pilot reached 40.2k
  unload_others: false       # 192 GB GPU: keep all three models loaded and run them in parallel

# Open-weight models only (Tereza, 2026-10-16), three developers, 3-4B, same
# 4-bit quantisation (q4_K_M), run locally with Ollama 0.30.11. Downloaded and
# pinned 2026-10-16 (digest = Ollama manifest digest; also logged per call).
